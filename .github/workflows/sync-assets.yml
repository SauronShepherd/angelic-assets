name: Sync Angelic public assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-assets.yml'
      - 'scripts/sync-public-assets.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync assets from production
        run: node scripts/sync-public-assets.mjs
      - name: Commit changes
        run: |
          git config user.name "angelic-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A brand newsletter images misc 2>/dev/null || git add -A brand newsletter images
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "chore: sync public assets"
          git push
